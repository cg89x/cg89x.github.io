<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
	<meta name="referrer" content="no-referrer">
	<meta name="robots" content="noindex">
	<title>FIN 30600 &mdash; join the game</title>
	<script>
		// Short join link for the FIN 30600 beauty-contest game:
		// christiankontz.com/play  ->  the tool's student submit page.
		// Preserves a session code passed as #s=CODE or ?s=CODE.
		(function () {
			var target = 'https://www.christiankontz.com/fin30600-tools/tools/beauty-contest/submit.html';
			var hash = window.location.hash;
			if (!hash) {
				var m = /[?&]s=([A-Za-z0-9]+)/.exec(window.location.search);
				if (m) hash = '#s=' + m[1];
			}
			window.location.replace(target + hash);
		}());
	</script>
	<style>
		body { font-family: Arial, Helvetica, sans-serif; margin: 3rem; color: #0A234B; }
		a { color: #0072B2; }
	</style>
</head>
<body>
	<p>Taking you to the game &hellip;
		<a href="https://www.christiankontz.com/fin30600-tools/tools/beauty-contest/submit.html">tap here</a>
		if nothing happens.</p>
</body>
</html>
